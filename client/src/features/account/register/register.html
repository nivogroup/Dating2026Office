<div class="card bg-base-100 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadow-lg mt-20">
  <div class="card-title justify-center text-3xl text-primary">Sign up</div>
  <div class="card-body w-full">
    <ul class="steps">
        <li class="step step-primary"> Credentials </li>
        <li class="step" [class.step-primary]="currentStep()===2">Profile</li>
    </ul>

    @if (currentStep() === 1) {
      <form [formGroup]="credentialsFrom" class="flex flex-col gap-4 w-full steps mt-3">
        <app-text-input class="mt-2" label="Email" formControlName="email" />
        <app-text-input label="Display Name" formControlName="displayName" />
        <app-text-input label="Password" formControlName="password" type="password" />
        <app-text-input label="Confirm Password" formControlName="confirmPassword" type="password"/>

        <!-- <input class="input w-full" name="email" [(ngModel)]="creds.email" placeholder="Email">
            <input class="input w-full" name="displayName" [(ngModel)]="creds.displayName" placeholder="Display Name">
            <input type="password" class="input w-full" name="password" [(ngModel)]="creds.password" placeholder="Password"> -->
        <!-- <select class="select w-full">
                <option disabled selected>Pick a member</option>
                @for (member of membersFromHome(); track $index) {
                    <option value="{{member.id}}">{{member.displayName}}</option>
                }
            </select> -->
        <div class="flex items-center justify-end gap-3">
          <button class="btn" (click)="cancel()" type="button">Cancel</button>
          <button [disabled]="!credentialsFrom.valid" (click)="nextStep()" class="btn btn-primary" type="button">
            Next
          </button>
        </div>
      </form>
    }

    @if (currentStep() === 2) {
      <form [formGroup]="profileForm" class="flex flex-col w-full gap-4 steps mt-3">
        <div class="flex items-center gap-4">
            <div class="font-semibold">Gender: </div>
            <label class="flex gap-3 items-center">
                <span>Male</span>
                <input type="radio" formControlName="gender" value="male" class="radio radio-primary">
            </label>
            <label class="flex gap-3 items-center">
                <span>Female</span>
                <input type="radio" formControlName="gender" value="female" class="radio radio-primary">
            </label>

        </div>
        <app-text-input [maxDate]="getMaxDate()" type="date" label="Date of Birth" formControlName="dateOfBirth" />
        <app-text-input label="city" formControlName="city" />
        <app-text-input label="country" formControlName="country" />
        <button class="btn" (click)="prevStep()" type="button">Back</button>
        <button [disabled]="!profileForm.valid" (click)="register()" class="btn btn-primary" type="button" >
          Register
        </button>
      </form>
    }
  </div>

  @if (validationErrors().length > 0) {
    <div class="mt-5 flex bg-gray-200 rounded-2xl w-1/2 p-3 mx-auto">
        <ul class="flex flex-col text-error space-y-1">
            @for (error of validationErrors(); track $index) {
                <li>{{error}}</li>
            }
        </ul>
    </div>
  }
</div>
